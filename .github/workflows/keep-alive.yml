name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes — keeps the Render free-tier service from spinning down
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    name: Ping Argus Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /health
        run: |
          echo "Pinging Argus backend at $(date -u)"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 https://argus-okop.onrender.com/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Backend is alive (HTTP $STATUS)"
          else
            echo "⚠️ Unexpected status code: $STATUS — backend may be starting up or degraded"
            # Don't fail the job — a cold start returns non-200 briefly, that's expected
            exit 0
          fi
